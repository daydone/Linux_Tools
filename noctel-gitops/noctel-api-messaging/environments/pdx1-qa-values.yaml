global:
  cluster: pdx1
  namespace: qa
  domain:
    prefix: pdx1-qa
    base: telnoc.com

noctel-api-messaging:
  version: "latest"
  replicaCount: 3
  image:
    pullPolicy: Always
  env:
    PORT: "7330"
    HEALTH_PORT: "9330"
    SERVICE_NAME: noctel-api-messaging
  # Provider credentials live in carrier.configuration (managed at
  # /super/carriers), never in gitops values. Do not add a secrets:
  # block here.
