apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pdx2-qa-platform-env
  namespace: argocd
  labels:
    environment: qa
    component: platform-env
spec:
  project: noctel-qa
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: platform-env/pdx2/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
