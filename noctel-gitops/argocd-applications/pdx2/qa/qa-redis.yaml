apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-qa
  namespace: argocd
  labels:
    environment: qa
    component: redis
spec:
  project: noctel-qa
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 22.0.0
    helm:
      values: |
        architecture: replication
        
        master:
          count: 1
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          persistence:
            enabled: true
            storageClass: longhorn
            size: 8Gi
        
        replica:
          replicaCount: 0
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          persistence:
            enabled: true
            storageClass: longhorn
            size: 8Gi
        
        image:
          repository: bitnami/redis
          tag: latest
        
        auth:
          enabled: false
        
        global:
          redis:
            password: ""
        
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
        
        fullnameOverride: redis-qa
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true