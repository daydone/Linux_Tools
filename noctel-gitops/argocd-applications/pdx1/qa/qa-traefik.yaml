apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-qa
  namespace: argocd
  labels:
    environment: qa
    component: traefik
spec:
  project: noctel-qa
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: traefik/charts
    helm:
      valueFiles:
        - ../environments/pdx1-qa-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
