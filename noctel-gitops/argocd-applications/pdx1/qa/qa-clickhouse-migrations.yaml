apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noctel-clickhouse-migrations-qa
  namespace: argocd
  labels:
    environment: qa
    cluster: pdx1
    component: noctel-clickhouse-migrations
spec:
  project: noctel-qa
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: noctel-clickhouse-migrations/charts
    helm:
      valueFiles:
        - ../environments/pdx1-qa-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
