apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noctel-notify-webhook-in-prod
  namespace: argocd
  labels:
    environment: prod
    component: noctel-notify-webhook-in
spec:
  project: noctel-prod
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: noctel-notify-webhook-in/charts
    helm:
      valueFiles:
        - ../environments/pdx1-prod-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
