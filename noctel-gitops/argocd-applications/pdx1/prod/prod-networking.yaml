apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pdx1-prod-networking
  namespace: argocd
  labels:
    environment: prod
    component: networking
spec:
  project: noctel-prod
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: networking/pdx1/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
