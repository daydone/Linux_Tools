apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chirpstack-gateway-bridge-dev
  namespace: argocd
  labels:
    environment: dev
    component: chirpstack-gateway-bridge
spec:
  project: noctel-dev
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: chirpstack-gateway-bridge/charts
    helm:
      valueFiles:
        - ../environments/pdx1-dev-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
