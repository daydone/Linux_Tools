apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pdx1-dev-syslog
  namespace: argocd
  labels:
    environment: dev
    component: logging
spec:
  project: default
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: noctel-syslog/charts
    helm:
      valueFiles:
      - ../environments/pdx1-dev-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
