apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-qa
  namespace: argocd
  labels:
    environment: qa
    component: traefik
spec:
  project: noctel-qa
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: charts/infrastructure/traefik
    helm:
      valueFiles:
        - ../../../environments/qa-config.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true