apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noctel-prod
  namespace: argocd
  labels:
    environment: prod
spec:
  project: default
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: .
    helm:
      valueFiles:
        - environments/prod-config.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true