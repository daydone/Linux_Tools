apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: dnsmadeeasy
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: noctel-qa
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: noctel-now
    app.kubernetes.io/part-of: noctel-now
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: noctel-now-0.1.0
  name: noctel-qa-api-ingress
  namespace: qa
spec:
  ingressClassName: traefik-qa
  rules:
  - host: pdx2-qa-api.telnoc.com
    http:
      paths:
      - backend:
          service:
            name: noctel-qa-api-service
            port:
              number: 3000
        path: /
        pathType: Prefix
  - host: pdx2-qa-api-int.telnoc.com
    http:
      paths:
      - backend:
          service:
            name: noctel-qa-api-service
            port:
              number: 3000
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - pdx2-qa-api.telnoc.com
    - pdx2-qa-api-int.telnoc.com
    secretName: pdx2-qa-api-telnoc-com-tls