apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "24"
    field.cattle.io/publicEndpoints: '[{"addresses":["10.0.98.21"],"port":80,"protocol":"TCP","serviceName":"qa:traefik-qa","allNodes":false},{"addresses":["10.0.98.21"],"port":443,"protocol":"TCP","serviceName":"qa:traefik-qa","allNodes":false}]'
    meta.helm.sh/release-name: traefik-qa
    meta.helm.sh/release-namespace: qa
  labels:
    app.kubernetes.io/instance: traefik-qa-qa
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: traefik
    helm.sh/chart: traefik-37.0.0
  name: traefik-qa
  namespace: qa
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: traefik-qa-qa
      app.kubernetes.io/name: traefik
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2025-08-19T15:10:12-07:00"
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/instance: traefik-qa-qa
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: traefik
        helm.sh/chart: traefik-37.0.0
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --global.checkNewVersion
        - --entryPoints.metrics.address=:9100/tcp
        - --entryPoints.traefik.address=:8080/tcp
        - --entryPoints.web.address=:80/tcp
        - --entryPoints.websecure.address=:443/tcp
        - --api.dashboard=true
        - --ping=true
        - --metrics.prometheus=true
        - --metrics.prometheus.entrypoint=metrics
        - --providers.kubernetescrd
        - --providers.kubernetescrd.allowEmptyServices=true
        - --providers.kubernetesingress
        - --providers.kubernetesingress.allowEmptyServices=true
        - --providers.kubernetesingress.ingressendpoint.publishedservice=qa/traefik-qa
        - --providers.kubernetescrd.namespaces=qa
        - --providers.kubernetesingress.namespaces=qa
        - --entryPoints.websecure.http.tls=true
        - --entryPoints.websecure.http.tls.certResolver=dnsmadeeasy
        - --log.level=INFO
        - --log.level=DEBUG
        - --certificatesresolvers.dnsmadeeasy.acme.dnschallenge.provider=dnsmadeeasy
        - --certificatesresolvers.dnsmadeeasy.acme.email=noc@telnoc.com
        - --certificatesresolvers.dnsmadeeasy.acme.dnschallenge.resolvers=8.8.8.8
        - --certificatesresolvers.dnsmadeeasy.acme.storage=/ssl-certs/acme-dnsmadeeasy.json
        - --certificatesresolvers.dnsmadeeasy.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              divisor: "1"
              resource: limits.cpu
        - name: GOMEMLIMIT
          value: 921MiB
        - name: DNSMADEEASY_API_EMAIL
          valueFrom:
            secretKeyRef:
              key: email
              name: dnsmadeeasy-credentials
        - name: DNSMADEEASY_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: dnsmadeeasy-credentials
        - name: DNSMADEEASY_API_SECRET
          valueFrom:
            secretKeyRef:
              key: api-secret
              name: dnsmadeeasy-credentials
        image: docker.io/traefik:v3.5.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        name: traefik-qa
        ports:
        - containerPort: 9100
          name: metrics
          protocol: TCP
        - containerPort: 8080
          name: traefik
          protocol: TCP
        - containerPort: 80
          name: web
          protocol: TCP
        - containerPort: 443
          name: websecure
          protocol: TCP
        readinessProbe:
          failureThreshold: 1
          httpGet:
            path: /ping
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /ssl-certs
          name: ssl-certs
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: pdx2-kworker0
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccount: traefik-qa
      serviceAccountName: traefik-qa
      terminationGracePeriodSeconds: 60
      volumes:
      - name: ssl-certs
        persistentVolumeClaim:
          claimName: traefik-qa
      - emptyDir: {}
        name: tmp
