autoDirectNodeRoutes: false
bpf:
  masquerade: true
cluster:
  name: default
devices: "bond0.675 bond0.677 bond0.678 bond0.679 ens161 ens192 ens224 ens256 ens18 ens19 ens20 ens21"
egressGateway:
  enabled: true
enableIPv4Masquerade: true
enableIdentityMark: false
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: 10.42.0.0/16
kubeProxyReplacement: true
operator:
  replicas: 2
routingMode: tunnel
tunnelProtocol: vxlan
tls:
  secretSync:
    enabled: false
hubble:
  metrics:
    dynamic:
      enabled: false

