apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/address-pool: qa-vlan-pool
    metallb.universe.tf/allow-shared-ip: "qa-email-egress"
  labels:
    app: noctel-notify-email-out
    cilium.io/l2-pool: qa-vlan
  name: noctel-notify-email-out-egress
  namespace: qa
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  loadBalancerIP: 10.0.98.152
  ports:
  - name: egress
    port: 25
    protocol: TCP
    targetPort: 25
  selector:
    app: noctel-notify-email-out
  sessionAffinity: None
  type: LoadBalancer
