deploymentMode: SingleBinary

# Disable CRD installation to avoid PodLogs CRD storedVersions issue
crds:
  enabled: false

loki:
  image:
    registry: pdx-harbor.telnoc.com
    repository: noctel/loki
    tag: "2.6.1"

  schemaConfig:
  - from: "2020-10-24"
    store: boltdb-shipper
    object_store: filesystem
    schema: v11
    index:
      prefix: index_
      period: 24h

imagePullSecrets:
  - name: harbor-pull

config:
  auth_enabled: false
  chunk_store_config:
    max_look_back_period: 0s
  table_manager:
    retention_deletes_enabled: false
    retention_period: 0s

persistence:
  enabled: true
  size: 50Gi
  storageClassName: local-path
