apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: noctel-infrastructure
  namespace: argocd
spec:
  description: Cluster Infrastructure (monitoring, reloader, rancher, etc)
  sourceRepos:
    - git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
  destinations:
    - namespace: reloader
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: rancher
      server: https://kubernetes.default.svc
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: networking.k8s.io
      kind: IngressClass
    - group: cilium.io
      kind: CiliumEgressGatewayPolicy
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
