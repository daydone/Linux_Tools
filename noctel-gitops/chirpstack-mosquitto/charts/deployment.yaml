apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirpstack-mosquitto-qa
  namespace: qa
  labels:
    app.kubernetes.io/component: chirpstack-mosquitto
    app.kubernetes.io/instance: noctel-qa
    app.kubernetes.io/name: noctel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: chirpstack-mosquitto
      app.kubernetes.io/instance: noctel-qa
      app.kubernetes.io/name: noctel
  template:
    metadata:
      labels:
        app.kubernetes.io/component: chirpstack-mosquitto
        app.kubernetes.io/instance: noctel-qa
        app.kubernetes.io/name: noctel
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - noctel
              topologyKey: kubernetes.io/hostname
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0.18
        imagePullPolicy: Always
        ports:
        - containerPort: 1883
          name: mqtt
          protocol: TCP
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 1883
          runAsUser: 1883
        volumeMounts:
        - mountPath: /mosquitto/config
          name: config
          readOnly: true
      securityContext:
        fsGroup: 1883
        runAsGroup: 1883
        runAsUser: 1883
      volumes:
      - name: config
        configMap:
          name: chirpstack-mosquitto-config