global:
  cluster: pdx1
  namespace: prod
  domain:
    prefix: pdx1-prod
    base: noctel.com

noctel-api-porting:
  version: "latest"
  replicaCount: 1
  image:
    pullPolicy: Always
  env:
    PORT: "7320"
    HEALTH_PORT: "9320"
    SERVICE_NAME: noctel-api-porting
    BANDWIDTH_IRIS_BASE_URL: "https://dashboard.bandwidth.com/api"
    INTELIQUENT_BASE_URL: "https://services.inteliquent.com"
  secrets:
    # TODO: add BANDWIDTH_ACCOUNT_ID, BANDWIDTH_USERNAME, BANDWIDTH_PASSWORD,
    #       BANDWIDTH_WEBHOOK_USERNAME, BANDWIDTH_WEBHOOK_PASSWORD,
    #       INTELIQUENT_CLIENT_ID, INTELIQUENT_CLIENT_SECRET
