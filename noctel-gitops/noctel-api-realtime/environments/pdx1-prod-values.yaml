global:
  cluster: pdx1
  namespace: prod
  domain:
    prefix: pdx1-prod
    base: noctel.com

noctel-api-realtime:
  version: "latest"
  replicaCount: 3
  image:
    pullPolicy: Always
  env:
    PORT: "7210"
    HEALTH_PORT: "9210"
    SERVICE_NAME: realtime
    ELASTICSEARCH_TIMEOUT_MS: "2000"
    CACHE_FILL_ENABLED: "true"
    # WS watchdog tolerance — 6 missed 30s pings = ~3min before terminate.
    # Chrome throttles background-tab timers to ~1/min, so a shorter window
    # was reaping healthy backgrounded desks; then their reconnect storm
    # tripped the per-token upgrade cap and locked users out (close 4029).
    # The 3min ceiling absorbs the throttle without letting truly-dead
    # sockets linger. Combined with /health/eventloop diagnostic (#483).
    WS_PING_INTERVAL_MS: "30000"
    WS_PING_MAX_MISSES: "6"
    # Per-token connect + upgrade rate caps. Bumped 2026-07-15 after a
    # customer at 4j.lane.edu still tripped 200/min + 20/sec during the
    # open HAProxy 20s WS cutoff (task #507) — every proxy-forced
    # reconnect counts against the user. Raised the ceiling; runaway
    # client bugs still get caught above 400/min.
    WS_CONNECT_PER_MIN: "400"
    WS_UPGRADE_PER_SEC: "30"
    # Per-user allowlist that bypasses both rate-limit buckets. Runbook
    # for adding/removing lives in the header comment of
    # noctel-api-realtime/src/websocket/connect-rate-limit.js (also
    # covers how to unblock a currently-rate-limited user via keydb-cli).
    # Keep the list short — add only customers hit by proxy-forced churn
    # (task #507), never to paper over a real client bug.
    #
    # 019eff67-...  silversharnly_c@4j.lane.edu  (Callie Silvers-Harnly)
    # 019f2a46-...  callie_s@4j.lane.edu         (Callie Silvers)
    WS_CONNECT_ALLOWLIST: "019eff67-1819-768c-aef9-04ec9b2be718,019f2a46-60ea-74ff-8168-436a863eb4bc"
  secrets:
