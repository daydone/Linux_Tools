# PDX1 ClickHouse Configuration
# Storage tiering: 12-24hrs hot in Longhorn, rest of 10-day retention in S3

clickhouse:
  # PDX1-specific resource allocation
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "12Gi"
      cpu: "6000m"

  # PDX1 persistence (Longhorn for hot data)
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 100Gi
    mountPath: /var/lib/clickhouse

  # PDX1-specific ClickHouse configuration
  config:
    # S3 storage policy configuration
    # Data moves to S3 after 24 hours via TTL
    storage_configuration:
      disks:
        default:
          path: /var/lib/clickhouse/store/
          keep_free_space_bytes: 10737418240  # 10GB

        s3_cold:
          type: s3
          endpoint_template: "http://seaweedfs-s3.prod.svc.cluster.local:8333/pdx-local/"
          access_key_id: "${S3_ACCESS_KEY}"
          secret_access_key: "${S3_SECRET_KEY}"
          use_environment_credentials: false
          metadata_path: /var/lib/clickhouse/disks/s3_cold/

      policies:
        tiered:
          volumes:
            hot:
              disk: default
            cold:
              disk: s3_cold
          rules:
            - name: move_to_s3_after_24h
              method: move
              regexp: \.part$
              min_bytes: 1048576  # 1MB minimum
              min_ratio: 0.1
              min_age_hours: 24

    # Replication settings (placeholder for future Phase 2)
    # Will be enabled when pdx2 replication is added
    zookeeper: null  # Not used in Phase 1 (single node)

    # Database configuration
    users:
      default:
        password: "{{ CLICKHOUSE_DEFAULT_PASSWORD }}"
        networks:
          ip: "10.0.0.0/8"  # Allow K3S cluster access
          host_regexp: "^clickhouse-.*"

    # Query settings
    max_insert_threads: 4
    max_memory_usage: "8589934592"  # 8GB
    max_execution_time: 600  # 10 minutes

    # Table settings
    table_function_remote_max_addresses: 1000
    distributed_replica_error_cap: 1000
    distributed_replica_error_half_life: 60

  # Service endpoints for pdx1
  service:
    type: ClusterIP
    annotations:
      prometheus: "true"

  # Monitoring/observability
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s

  # Liveness and readiness probes
  livenessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

  # Pod scheduling for pdx1
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/role
                operator: In
                values: ["worker"]

  # Environment variables for secrets (referenced from K3S secrets)
  env:
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: clickhouse-s3-credentials
          key: access_key_id
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: clickhouse-s3-credentials
          key: secret_access_key

  # Pod security and networking
  podSecurityContext:
    runAsUser: 101  # clickhouse user
    runAsGroup: 101
    fsGroup: 101

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
