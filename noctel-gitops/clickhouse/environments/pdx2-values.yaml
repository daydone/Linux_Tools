# PDX2 ClickHouse Configuration
# Phase 2 deployment: Replication setup with pdx1 via ZooKeeper
# This file will be activated when pdx2 ClickHouse replication is deployed

clickhouse:
  # PDX2-specific resource allocation
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "12Gi"
      cpu: "6000m"

  # PDX2 persistence (Longhorn for hot data)
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 100Gi
    mountPath: /var/lib/clickhouse

  # PDX2-specific ClickHouse configuration
  config:
    # S3 storage policy configuration (same as PDX1)
    # Both clusters share same S3 bucket for cold storage
    storage_configuration:
      disks:
        default:
          path: /var/lib/clickhouse/store/
          keep_free_space_bytes: 10737418240  # 10GB

        s3_cold:
          type: s3
          endpoint_template: "http://seaweedfs-s3.prod.svc.cluster.local:8333/pdx-local/"
          access_key_id: "${S3_ACCESS_KEY}"
          secret_access_key: "${S3_SECRET_KEY}"
          use_environment_credentials: false
          metadata_path: /var/lib/clickhouse/disks/s3_cold/

      policies:
        tiered:
          volumes:
            hot:
              disk: default
            cold:
              disk: s3_cold
          rules:
            - name: move_to_s3_after_24h
              method: move
              regexp: \.part$
              min_bytes: 1048576  # 1MB minimum
              min_ratio: 0.1
              min_age_hours: 24

    # Replication settings (Phase 2: enabled when deployed)
    # ZooKeeper coordination for distributed replication
    zookeeper:
      nodes:
        - "pdx-zk0.clickhouse.svc.cluster.local:2181"
        - "pdx-zk1.clickhouse.svc.cluster.local:2181"
        - "pdx-zk2.clickhouse.svc.cluster.local:2181"
      session_timeout_ms: 30000
      operation_timeout_ms: 10000

    # Replication table settings
    replica_name: "pdx2-replica"
    shard_name: "pdx1-pdx2-shard"

    # Database configuration
    users:
      default:
        password: "{{ CLICKHOUSE_DEFAULT_PASSWORD }}"
        networks:
          ip: "10.0.0.0/8"  # Allow K3S cluster access
          host_regexp: "^clickhouse-.*"

    # Query settings (same as PDX1)
    max_insert_threads: 4
    max_memory_usage: "8589934592"  # 8GB
    max_execution_time: 600  # 10 minutes

  # Service endpoints for pdx2
  service:
    type: ClusterIP
    annotations:
      prometheus: "true"

  # Monitoring/observability
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s

  # Liveness and readiness probes
  livenessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

  # Pod scheduling for pdx2
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/region
                operator: In
                values: ["pdx2"]

  # Environment variables for secrets
  env:
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: clickhouse-s3-credentials
          key: access_key_id
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: clickhouse-s3-credentials
          key: secret_access_key

  # Pod security and networking
  podSecurityContext:
    runAsUser: 101  # clickhouse user
    runAsGroup: 101
    fsGroup: 101

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

# Phase 2 implementation notes:
# 1. ZooKeeper cluster deployment (3 nodes) required before ClickHouse replication
# 2. Table creation must use ReplicatedMergeTree engine
# 3. Both clusters reference same S3 bucket for cold storage
# 4. Failover testing should include cross-cluster queries
# See CLICKHOUSE-DEPLOYMENT.md "Future Expansion" for full details
