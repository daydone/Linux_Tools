global:
  cluster: pdx2
  namespace: prod
  domain:
    prefix: pdx2-prod
    base: telnoc.com

noctel-api-gateway:
  version: "latest"
  replicaCount: 1
  env:
    # In-cluster URL for the desk-version watcher's poll. See the pdx1-prod
    # values.yaml comment for the full rationale — the public host isn't
    # reachable via hairpin, so the watcher silently disabled itself and
    # the desk banner never fired.
    DESK_VERSION_URL: "http://noctel-desk.prod.svc.cluster.local/version.json"
