global:
  namespace: prod

seaweedfs:
    version: "3.57"
    replicaCount: 3
    initBuckets:
      - pdx-prod
    master:
      replicas: 3
    image:
      repository: chrislusf/seaweedfs
      pullPolicy: IfNotPresent
    # Use external SeaweedFS cluster on VLAN 650
    externalMaster:
      enabled: true
      endpoint: "pdx-s3-master.telnoc.com:9333"  # 10.0.91.24
    # Deploy masters in k8s instead of external cluster
    deployMaster: false
    deployVolume: false
    deployFiler: true   # Deploy filer to access external cluster
    deployS3: true      # Deploy S3 gateway
    ingress:
      filer:
        enabled: true
        name: prod-filer-ingress
        ingressClassName: traefik-prod
        hosts:
          - host: pdx1-prod-filer.telnoc.com
        tls:
          - hosts:
              - pdx1-prod-filer.telnoc.com
    # Enable Cilium egress gateway to route traffic through VLAN 650
    egressGateway:
      enabled: true
      interface: bond0.650
    # S3 API Access Control Configuration - bucket-scoped credentials
    s3:
      configMap:
        enabled: true
        name: seaweedfs-s3-config-prod
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
