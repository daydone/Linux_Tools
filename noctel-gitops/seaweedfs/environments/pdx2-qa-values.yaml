seaweedfs:
    # Environment-specific naming
    namePrefix: "seaweedfs-qa"
    # Storage configuration
    master:
      storage:
        size: "10Gi"
        storageClass: "longhorn"
    volume:
      replicas: 0
      storage:
        size: "20Gi"
        storageClass: "longhorn"
    filer:
      replicas: 0
      storage:
        size: "10Gi"
        storageClass: "longhorn"
    s3:
      replicas: 0
