apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "noctelCh.fullname" . }}-schema
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: noctel-clickhouse-migrations
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/hook: {{ .Values.migrations.argoHook }}
    argocd.argoproj.io/sync-wave: "-1"
data:
{{- range $path, $_ := .Files.Glob "files/*.sql" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
  apply.sh: |-
    #!/usr/bin/env bash
    # Apply every files/*.sql against the target database. Idempotent —
    # every CREATE uses IF NOT EXISTS. The source files reference the
    # dev/local database name `noctel_trace_local` and `USE noctel_trace_local`
    # so we rewrite both to the env-target db at runtime, keeping a single
    # source of truth shared with noctel-api-trace/dev/.
    set -euo pipefail

    : "${CH_HOST:?CH_HOST required}"
    : "${CH_PORT:?CH_PORT required}"
    : "${CH_USER:?CH_USER required}"
    : "${CH_DB:?CH_DB required}"
    CH_PASSWORD="${CH_PASSWORD:-}"

    echo "[migrate] target ch=${CH_HOST}:${CH_PORT} user=${CH_USER} db=${CH_DB}"

    # Wait for server (post-bootstrap clusters sometimes lag a few seconds).
    for i in $(seq 1 60); do
      if clickhouse-client --host "$CH_HOST" --port "$CH_PORT" \
           --user "$CH_USER" ${CH_PASSWORD:+--password "$CH_PASSWORD"} \
           --query "SELECT 1" >/dev/null 2>&1; then
        break
      fi
      sleep 2
    done

    cd /schema
    for f in $(ls *.sql | sort); do
      echo "[migrate] applying $f"
      sed -e "s/noctel_trace_local/${CH_DB}/g" "$f" \
        | clickhouse-client --host "$CH_HOST" --port "$CH_PORT" \
            --user "$CH_USER" ${CH_PASSWORD:+--password "$CH_PASSWORD"} \
            --multiquery --database "${CH_DB}"
    done

    echo "[migrate] post-apply tables in ${CH_DB}:"
    clickhouse-client --host "$CH_HOST" --port "$CH_PORT" \
      --user "$CH_USER" ${CH_PASSWORD:+--password "$CH_PASSWORD"} \
      --query "SELECT name FROM system.tables WHERE database = '${CH_DB}' ORDER BY name FORMAT TSV"
    echo "[migrate] done"
