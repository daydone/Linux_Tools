{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-{{ .Release.Namespace }}
  labels:
    app: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: traefik-{{ .Release.Namespace }}
    namespace: {{ .Release.Namespace }}
{{- end }}
