{{- if .Values.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-{{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: traefik-{{ .Release.Namespace }}
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-{{ .Release.Namespace }}
{{- end }}
