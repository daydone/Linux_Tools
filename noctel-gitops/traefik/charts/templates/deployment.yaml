apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-{{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: traefik-{{ .Release.Namespace }}
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-{{ .Release.Namespace }}
    version: {{ .Values.traefik.image.tag }}
spec:
  replicas: {{ .Values.traefik.replicas }}
  selector:
    matchLabels:
      app: traefik-{{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app: traefik-{{ .Release.Namespace }}
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-{{ .Release.Namespace }}
        version: {{ .Values.traefik.image.tag }}
    spec:
      serviceAccountName: traefik-{{ .Release.Namespace }}
      {{- if .Values.traefik.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.traefik.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.traefik.affinity }}
      affinity:
        {{- toYaml .Values.traefik.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.traefik.persistence }}
      {{- if .Values.traefik.persistence.enabled }}
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ['sh', '-c', 'mkdir -p /ssl-certs && chmod 700 /ssl-certs && touch /ssl-certs/acme-dnsmadeeasy.json && chmod 600 /ssl-certs/acme-dnsmadeeasy.json']
        volumeMounts:
        - name: ssl-certs
          mountPath: /ssl-certs
      {{- end }}
      {{- end }}
      containers:
      - name: traefik
        image: "{{ .Values.traefik.image.repository | default .Values.traefik.image.name }}:{{ .Values.traefik.image.tag }}"
        imagePullPolicy: {{ .Values.traefik.image.pullPolicy | default "IfNotPresent" }}
        args:
        {{- range .Values.traefik.args }}
        - {{ . }}
        {{- end }}
        env:
        - name: DNSMADEEASY_API_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.traefik.dnsmadeeasySecretName | default "dnsmadeeasy-credentials" }}
              key: email
        - name: DNSMADEEASY_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.traefik.dnsmadeeasySecretName | default "dnsmadeeasy-credentials" }}
              key: api-key
        - name: DNSMADEEASY_API_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.traefik.dnsmadeeasySecretName | default "dnsmadeeasy-credentials" }}
              key: api-secret
        ports:
        - name: web
          containerPort: 80
          protocol: TCP
        - name: websecure
          containerPort: 443
          protocol: TCP
        - name: metrics
          containerPort: 9100
          protocol: TCP
        - name: traefik
          containerPort: 8080
          protocol: TCP
        {{- if index .Values.traefik.service.ports "amqp" }}
        - name: amqp
          containerPort: 5672
          protocol: TCP
        {{- end }}
        {{- if .Values.traefik.persistence }}
        {{- if .Values.traefik.persistence.enabled }}
        volumeMounts:
        - name: ssl-certs
          mountPath: /ssl-certs
        - name: tmp
          mountPath: /tmp
        {{- end }}
        {{- end }}
        # Health probes disabled: ACME cert renewal hangs on startup, preventing port 8000
        # from opening. Probes would prevent pod from becoming ready/restarting it. QA also
        # has no probes. TODO: Fix ACME initialization or disable cert provisioning.
        # readinessProbe:
        #   tcpSocket:
        #     port: 8000
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        #   timeoutSeconds: 3
        # livenessProbe:
        #   tcpSocket:
        #     port: 8000
        #   initialDelaySeconds: 60
        #   periodSeconds: 20
        #   timeoutSeconds: 3
        resources:
          {{- toYaml .Values.traefik.resources | nindent 10 }}
      {{- if .Values.traefik.persistence }}
      {{- if .Values.traefik.persistence.enabled }}
      volumes:
      - name: ssl-certs
        persistentVolumeClaim:
          claimName: traefik-{{ .Release.Name | replace "traefik-" "" }}
      - name: tmp
        emptyDir: {}
      {{- end }}
      {{- end }}
