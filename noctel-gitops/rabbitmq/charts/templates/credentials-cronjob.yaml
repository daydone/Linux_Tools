{{- if .Values.rabbitmq.createUser }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rabbitmq-extract-credentials
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: rabbitmq
    component: credentials-extractor
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: rabbitmq-extractor-sa
          restartPolicy: Never
          containers:
          - name: extractor
            image: bitnami/kubectl:latest
            env:
            - name: KUBECTL_TIMEOUT
              value: "10s"
            command:
              - /bin/sh
              - -c
              - |
                set -e

                NS={{ .Values.global.namespace | default "default" }}

                # Get AMQP_URL from noctel-api-secrets
                AMQP_URL=$(kubectl get secret noctel-api-secrets -n $NS -o jsonpath='{.data.AMQP_URL}' | base64 -d)

                if [ -z "$AMQP_URL" ]; then
                  echo "ERROR: AMQP_URL not found in noctel-api-secrets"
                  exit 1
                fi

                # Extract username and password using printf to avoid shell expansion
                USERNAME=$(printf '%s' "$AMQP_URL" | sed -n 's|amqp://\([^:]*\):.*|\1|p')
                PASSWORD=$(printf '%s' "$AMQP_URL" | sed -n 's|.*:\([^@]*\)@.*|\1|p')

                if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
                  echo "ERROR: Could not extract credentials from AMQP_URL"
                  exit 1
                fi

                echo "Extracted credentials - username: $USERNAME"

                # Check if secret exists
                if kubectl get secret rabbitmq-user-credentials -n $NS &>/dev/null; then
                  # Update existing secret
                  kubectl patch secret rabbitmq-user-credentials -n $NS \
                    -p "{\"data\":{\"username\":\"$(echo -n $USERNAME | base64 -w0)\",\"password\":\"$(echo -n $PASSWORD | base64 -w0)\"}}"
                  echo "Updated rabbitmq-user-credentials secret"
                else
                  # Create new secret
                  kubectl create secret generic rabbitmq-user-credentials \
                    --from-literal=username="$USERNAME" \
                    --from-literal=password="$PASSWORD" \
                    -n $NS
                  echo "Created rabbitmq-user-credentials secret"
                fi

                # Set RabbitMQ permissions for the extracted user
                # Find RabbitMQ pod and set permissions to access "/" vhost
                RABBIT_POD=$(kubectl get pods -n $NS -l app.kubernetes.io/name=rabbitmq -o jsonpath='{.items[0].metadata.name}')
                if [ -n "$RABBIT_POD" ]; then
                  kubectl exec -n $NS "$RABBIT_POD" -- rabbitmqctl set_permissions -p "/" "$USERNAME" ".*" ".*" ".*" 2>&1 | grep -i "setting\|error"
                  echo "RabbitMQ permissions set for user: $USERNAME"
                else
                  echo "WARNING: Could not find RabbitMQ pod to set permissions"
                fi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-extractor-sa
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: rabbitmq
    component: credentials-extractor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-extractor-role
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: rabbitmq
    component: credentials-extractor
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-extractor-rolebinding
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: rabbitmq
    component: credentials-extractor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-extractor-role
subjects:
- kind: ServiceAccount
  name: rabbitmq-extractor-sa
  namespace: {{ .Values.global.namespace | default "default" }}
{{- end }}
