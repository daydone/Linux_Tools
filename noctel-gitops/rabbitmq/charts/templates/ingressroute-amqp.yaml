{{- if dig "amqp" "ingressRoute" "enabled" false .Values.rabbitmq }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rabbitmq-amqp
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: ha-rabbit
    component: amqp
spec:
  entryPoints:
    - amqp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: ha-rabbit
          port: 5672
{{- end }}
