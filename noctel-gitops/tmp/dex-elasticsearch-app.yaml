apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex-elasticsearch
  namespace: argocd
  labels:
    environment: dex
    component: elasticsearch
    temporary: "true"
spec:
  project: noctel-dev
  source:
    repoURL: git@bitbucket.org:noctel-bitbucket/noctel-gitops.git
    targetRevision: HEAD
    path: tmp/dex-elasticsearch
  destination:
    server: https://kubernetes.default.svc
    namespace: dex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
