global:
  cluster: pdx1
  namespace: prod
  domain: { prefix: pdx1-prod, base: noctel.com }

noctel-api-fma:
  version: "latest"
  replicaCount: 3
  image: { pullPolicy: Always }
  env:
    PORT: "7082"
    HEALTH_PORT: "9082"
    HOST: "0.0.0.0"
    SERVICE_NAME: api-fma
    LOG_LEVEL: info
    NODE_ENV: production
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: "2", memory: 1Gi }
