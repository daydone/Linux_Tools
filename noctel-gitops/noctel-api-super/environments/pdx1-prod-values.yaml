global:
  cluster: pdx1
  namespace: prod
  domain:
    prefix: pdx1-prod
    base: noctel.com

noctel-api-super:
  version: "latest"
  replicaCount: 1
  image:
    pullPolicy: Always
  imagePullSecrets:
    - name: harbor-pull
    - name: dockerhub-secret
  env:
    # Canonical noctel-api-super ports per noctel-standards/MICROSERVICES_PORTS.md
    # are 7271/9271. The previous 7270/9270 here mirrored a wrong dev value
    # that was already corrected — fixing prod to match.
    PORT: "7271"
    HEALTH_PORT: "9271"
    SERVICE_NAME: noctel-api-super
  secrets:
