global:
  cluster: pdx1
  namespace: dev
  domain:
    prefix: pdx1-dev
    base: telnoc.com

noctel-syslog:
  version: "latest"
  replicaCount: 1
  image:
    pullPolicy: Always
  env:
    SYSLOG_TLS_REQUIRE_CLIENT_CERT: "false"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
