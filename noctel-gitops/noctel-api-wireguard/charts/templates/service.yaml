apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: ClusterIP
  ports:
  - port: 7270
    targetPort: http
    protocol: TCP
    name: http
  - port: 9270
    targetPort: health
    protocol: TCP
    name: health
  selector:
    app: {{ .Chart.Name }}
