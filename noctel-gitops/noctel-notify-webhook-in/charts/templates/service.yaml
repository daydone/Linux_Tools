apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
  ports:
  - name: http
    port: 7408
    targetPort: http
    protocol: TCP
  - name: health
    port: 9408
    targetPort: health
    protocol: TCP
