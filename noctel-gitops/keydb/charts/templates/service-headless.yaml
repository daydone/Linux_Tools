{{- if .Values.keydb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keydb-headless
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: keydb
spec:
  clusterIP: None
  ports:
  - port: {{ .Values.keydb.headlessService.port }}
    targetPort: keydb
    protocol: TCP
    name: keydb
  selector:
    app: keydb
{{- end }}
