{{- if and .Values.keydb.enabled .Values.keydb.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: keydb-tcp
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: keydb
spec:
  entryPoints:
    - keydb-{{ .Values.global.namespace }}
  routes:
  - match: HostSNI(`*`)
    services:
    - name: keydb
      port: {{ .Values.keydb.service.port }}
{{- end }}
