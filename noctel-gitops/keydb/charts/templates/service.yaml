{{- if .Values.keydb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keydb
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: keydb
  {{- with .Values.keydb.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.keydb.service.type }}
  ports:
  - port: {{ .Values.keydb.service.port }}
    targetPort: keydb
    protocol: TCP
    name: keydb
  - port: 9121
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: keydb
  sessionAffinity: None
{{- end }}
