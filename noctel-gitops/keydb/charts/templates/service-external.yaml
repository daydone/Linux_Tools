{{- if and .Values.keydb.enabled .Values.keydb.externalLoadBalancerIP }}
apiVersion: v1
kind: Service
metadata:
  name: keydb-external
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app: keydb
    component: external-loadbalancer
  annotations:
    metallb.universe.tf/address-pool: {{ .Values.keydb.metalLBPool | default "qa-vlan-pool" }}
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.keydb.externalLoadBalancerIP }}
  ports:
  - port: 6379
    targetPort: keydb
    protocol: TCP
    name: keydb
  selector:
    app: keydb
  sessionAffinity: None
{{- end }}
