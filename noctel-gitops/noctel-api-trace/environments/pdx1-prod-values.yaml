global:
  cluster: pdx1
  namespace: prod
  domain:
    prefix: pdx1-prod
    base: telnoc.com

noctel-api-trace:
  version: "latest"
  replicaCount: 2
  image:
    pullPolicy: Always
  env:
    PORT: "7370"
    HEALTH_PORT: "9370"
    SERVICE_NAME: trace
    CACHE_FILL_ENABLED: "true"
    # Prod CH map is operator-edited once both region clusters land.
    # Until then, /trace/calls/active still works against KeyDB; the
    # historical search returns 503 (degraded).
    CLICKHOUSE_HOSTS: "{}"
    CLICKHOUSE_QUERY_TIMEOUT_MS: "10000"
    CLICKHOUSE_FAN_TIMEOUT_MS: "15000"
    TRACE_IMPORT_EXCHANGE: "sip.trace"
    STORAGE_API_URL: "http://noctel-api-storage:7170"
  secrets:
