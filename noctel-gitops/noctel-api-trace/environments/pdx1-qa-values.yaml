global:
  cluster: pdx1
  namespace: qa
  domain:
    prefix: pdx1-qa
    base: telnoc.com

noctel-api-trace:
  version: "latest"
  replicaCount: 1
  image:
    pullPolicy: Always
  env:
    PORT: "7370"
    HEALTH_PORT: "9370"
    SERVICE_NAME: trace
    CACHE_FILL_ENABLED: "true"
    # Region map with credentials embedded in each URL. Set via
    # noctel-api-secrets once CH clusters land.
    CLICKHOUSE_HOSTS: "{}"
    CLICKHOUSE_QUERY_TIMEOUT_MS: "10000"
    CLICKHOUSE_FAN_TIMEOUT_MS: "15000"
    TRACE_IMPORT_EXCHANGE: "sip.trace"
    STORAGE_API_URL: "http://noctel-api-storage:7170"
  secrets:
