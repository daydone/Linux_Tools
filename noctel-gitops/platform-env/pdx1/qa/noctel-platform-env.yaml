# Platform-wide environment for pdx1 / qa namespace.
# See pdx1-dev-platform-env.yaml for the scope rules.
apiVersion: v1
kind: ConfigMap
metadata:
  name: noctel-platform-env
  namespace: qa
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  NODE_ENV: qa
  LOG_LEVEL: info
  CLUSTER: pdx1
  NAMESPACE: qa

  # ClickHouse (ClickStack) for SIP traces. CLICKHOUSE_URL is in
  # noctel-api-secrets (managed manually / 1Password) so it can carry creds
  # later. Database is non-secret + per-namespace, so it stays here. SIP traces
  # use noctel_trace_<ns>, not the OTel `default` db. Read by noctel-api-trace +
  # the sip->ClickHouse ingester (both envFrom noctel-api-secrets already).
  CLICKHOUSE_DATABASE: noctel_trace_qa

  # All URLs that have credentials get moved to noctel-api-secrets
  # and are modified ONLY in 1Password and use kubectl to apply

  # GATEWAY_URL is embedded in EXTERNAL links (file/logo URLs, invoice
  # links) so it must be the public, browser-reachable hostname, NOT the
  # in-cluster service DNS. QA public API is api.mocktel.com (the
  # LB-fronted host the desk also uses), not pdx1-qa-api-gateway.
  # FRONTEND_URL uses desk.mocktel.com (the externally-reachable host);
  # pdx1-qa-desk.mocktel.com is internal/VPN-only — matches the
  # noctel-api-account pdx1-qa override.
  # TODO: GATEWAY_URL and PUB_NTAPI_URL are redundant (both = public API
  # base URL). Consolidate onto one: migrate the GATEWAY_URL consumers
  # (noctel-standards file-url-resolver.js, noctel-api-account
  # logo-url.js, noctel-api-billing invoice route) then drop GATEWAY_URL.
  # NB: qa PUB_NTAPI_URL is still pdx1-qa-api-gateway.mocktel.com — the
  # consolidation should reconcile that to api.mocktel.com too.
  GATEWAY_URL:             https://api.mocktel.com
  FRONTEND_URL:            https://desk.mocktel.com
  PUB_NTAPI_URL:           https://pdx1-qa-api-gateway.mocktel.com
  PUB_SLACK_IN_URL:        https://pdx1-qa-slack.mocktel.com

  SERVICE_ACCOUNT_URL:     http://noctel-api-account:7110
  SERVICE_ACTIONS_URL:     http://noctel-api-actions:7272
  SERVICE_BILLING_URL:     http://noctel-api-billing:7180
  SERVICE_CACHE_SYNC_URL:  http://noctel-api-cache-sync:7190
  SERVICE_CNAM_URL:        http://noctel-api-cnam:7340
  SERVICE_DEVICES_URL:     http://noctel-api-devices:7230
  SERVICE_DEX_URL:         http://noctel-api-dex:7140
  SERVICE_E911_URL:        http://noctel-api-e911:7350
  SERVICE_FLOW_URL:        http://noctel-api-flow:7240
  SERVICE_MAILBOX_URL:     http://noctel-api-mailbox:7150
  SERVICE_MESSAGING_URL:   http://noctel-api-messaging:7330
  SERVICE_MONITOR_URL:     http://noctel-api-monitor:7260
  SERVICE_NOTIFY_URL:      http://noctel-api-notify:7130
  SERVICE_NUMBERS_URL:     http://noctel-api-numbers:7310
  SERVICE_PORTING_URL:     http://noctel-api-porting:7320
  SERVICE_REALTIME_URL:    http://noctel-api-realtime:7210
  SERVICE_STORAGE_URL:     http://noctel-api-storage:7170
  SERVICE_SUPER_URL:       http://noctel-api-super:7271
  SERVICE_TALK_URL:        http://noctel-api-talk:7200
  SERVICE_WIREGUARD_URL:   http://noctel-api-wireguard:7270
  SERVICE_WORKFLOW_URL:    http://noctel-api-workflow:7160

  SEAWEEDFS_FILER_URL:     http://seaweedfs-filer:8888

  # ── FaxBack ATA Connector (shared with legacy FMA) ─────────────
  # Single physical FaxBack server at 10.0.90.27:71. Shared with
  # the legacy FMA system; noctel-api-fma must filter mutating
  # FaxBack calls to platform-owned FMAs (see service CLAUDE.md).
  FAXBACK_API_URL:         http://10.0.90.27:71

  HISTORY_ENABLED:         "1"
  HISTORY_READS:           "0"
  HISTORY_WRITES:          "1"
  HISTORY_BULK:            "1"
  HISTORY_PII_UNMASK:      "0"
  HISTORY_EXCHANGE:        noctel.history
  HISTORY_QUEUE:           history.index
  HISTORY_RETENTION_DAYS:  "90"
  HISTORY_ROLLOVER_GB:     "10"
  HISTORY_EXCLUDE_TABLES:  "session,refresh_token,rate_limit,api_key_usage_log,schema_migrations,noctel_migrations"

  # ── JWT TTL — see pdx1-dev for rationale ────────────────────────
  # 30m access token + 30d refresh token. The KeyDB blocklist TTL
  # (jwt-blocklist.js) keys off JWT_ACCESS_EXPIRES_IN so the two
  # MUST match — if access tokens outlive their blocklist entries,
  # a logged-out user could still authenticate.
  JWT_ACCESS_EXPIRES_IN:  30m
  JWT_REFRESH_EXPIRES_IN: 30d

  # ── ANTHROPIC API ────────────────────────────────────────────────
  # This enables the action editor import feature
  IMPORT_ENABLED:         "true"

  # ── WIREGUARD ────────────────────────────────────────────────────
  # The services that are available within Wireguard 
  # WG_LNS is the internal IP within the WG pod that is DNAT sends
  # traffic to at WG_CHIRPSTACK on MetalLB
  WG_ENDPOINT_HOST:       "wg.mocktel.com"
  WG_SERVER_ADDRESS:      "10.100.0.1/16"
  WG_DATACENTER_ID:       "pdx-qa"
  WG_LNS_VIP:             "10.100.0.2"
  WG_CHIRPSTACK_IP:       "10.0.98.80"

  # CHIRPSTACK
  # Per-namespace ChirpStack core; same shape as prod. SERVER_ID's
  # `pdx1-qa` prefix is parsed by noctel-worker-chirp-out to derive
  # its region routing-key suffix. Added 2026-05-17 — without these
  # keys the worker fails config validation at boot and crashloops.
  CHIRPSTACK_URL:         "chirpstack-core.qa.svc.cluster.local:8080"
  CHIRPSTACK_TLS:         "false"
  CHIRPSTACK_SERVER_ID:   "pdx1-qa"

  # ── OpenTelemetry ────────────────────────────────────────────────
  BAD_NODE_OPTIONS: "--require @opentelemetry/auto-instrumentations-node/register"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_RESOURCE_ATTRIBUTES: "k8s.namespace.name=qa,k8s.cluster.name=pdx1"

  # --- Voice -----
  SIP_REALM: "talk.noctel.net"
  # Phone-side DNS fallback so talk.noctel.net resolves on the handset where there
  # is no real DNS for the realm. Comma-separated QA SBC IP(s); noctel-provisioning
  # renders these into the Poly dns.cache (sbc_dns[]). Leave EMPTY if QA has real
  # DNS/SRV for talk.noctel.net. TODO: set the QA SBC IP(s) (pdx-qa-sbc*).
  SBC_DNS_FALLBACK: ""
  # Push device HA1 creds to an SBC the moment its umbilical connects (not just the
  # 15-min reconcile sweep) so a freshly-(re)started SBC's KeyDB is populated fast.
  SBC_FULL_SYNC_ON_CONNECT: "true"
