    PORT: "7310"
    HEALTH_PORT: "9310"
    SERVICE_NAME: noctel-api-numbers
  secrets:
    #       INTELIQUENT_CLIENT_ID, INTELIQUENT_CLIENT_SECRET, TELNYX_API_KEY
