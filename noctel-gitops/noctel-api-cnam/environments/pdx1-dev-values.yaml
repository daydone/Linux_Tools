global:
  cluster: pdx1
  namespace: dev
  domain:
    prefix: pdx1-dev
    base: telnoc.com

noctel-api-cnam:
  version: "latest"
  replicaCount: 3
  image:
    pullPolicy: Always
  imagePullSecrets:
