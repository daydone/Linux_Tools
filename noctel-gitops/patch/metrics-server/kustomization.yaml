apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Patch the K3s-managed metrics-server deployment to fix SPOF
# Scales from 1 to 2 replicas with pod anti-affinity for HA

namespace: kube-system

patches:
  - path: metrics-server-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: metrics-server
