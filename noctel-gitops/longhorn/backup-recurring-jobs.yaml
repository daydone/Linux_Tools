---
# Daily backup job - keeps 7 days of backups (current week only)
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup-7days
  namespace: longhorn-system
spec:
  cron: "0 9 * * *"  # 9 AM UTC = 2 AM PDT every day
  task: "backup"
  groups:
  - default
  retain: 7
  concurrency: 1
  labels:
    app: longhorn
    backup-type: daily

