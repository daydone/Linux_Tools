global:
  cluster: pdx1
  namespace: dev
  domain:
    prefix: pdx1-dev
    base: telnoc.com

noctel-notify-websocket-out:
  version: "latest"
  replicaCount: 1
  image:
    pullPolicy: Always
  env:
    HEALTH_PORT: "9410"
    SERVICE_NAME: noctel-notify-websocket-out
    # Service is `noctel-api-gateway-multiport` (LoadBalancer) on :7100,
    # not `noctel-api-gateway:3000`. Wrong URL caused every push to fail
    # with "fetch failed" and (combined with consumer.js's broken retry
    # cap) loop the queue indefinitely.
    GATEWAY_INTERNAL_URL: "http://noctel-api-gateway-multiport.dev.svc.cluster.local:7100"
  secrets:
    # TODO: add GATEWAY_SERVICE_TOKEN
