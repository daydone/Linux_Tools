global:
  namespace: prod
  imagePullSecrets:
    - name: harbor-pull
    - name: dockerhub-secret

noctel-worker-platform-sync:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  extraEnv:
    - name: PLATFORM_SYNC_ENV
      value: "prod"
