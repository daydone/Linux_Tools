noctel-display:
    version: "v1.0.35"
    replicaCount: 3
    image:
      pullPolicy: Always
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      fsGroup: 1001
    nodeSelector:
      node-role.kubernetes.io/worker: "true"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - noctel
            topologyKey: kubernetes.io/hostname
    probes:
      readiness:
        httpGet:
          path: /ping
          port: http
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
      liveness:
        httpGet:
          path: /ping
          port: http
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
    volumes:
      - name: logs
        emptyDir: {}
    volumeMounts:
      - name: logs
        mountPath: /app/logs
    env:
      NODE_ENV: development
      PORT: "3001"
      LOG_LEVEL: info
      LOG_DIR: "./logs"
      # API and service URLs
      NOCTEL_API_URL: http://noctel-api-service.qa.svc.cluster.local:3000
      WS_URL: wss://pdx1-qa-api.mocktel.com/ws
      PUB_DISPLAY_URL: https://pdx1-qa-display.mocktel.com
      # REDIS_URL, SESSION_SECRET, JWT_ACCESS_SECRET sourced from
      # noctel-api-secrets (envFrom in chart). DB_PASSWORD,
      # RABBITMQ_PASSWORD, ASSEMBLYAI/MAPBOX/OPENWEATHER API keys
      # sourced from noctel-display-secrets.
      # Debug settings
      DEBUG: "true"
      DEBUG_API: "1"
      DEBUG_ENABLED: "true"
      DEBUG_ERRORS: "true"
      DEBUG_HTTP_RESPONSES: "true"
      DEBUG_WS_CONNECTION: "true"
      DEBUG_WS_ERRORS: "true"
      # Features
      SCREEN_SHARE_ENABLED: "true"
