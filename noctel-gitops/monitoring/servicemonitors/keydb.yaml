apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keydb
  namespace: monitoring
  labels:
    release: kube-prometheus-stack-pdx1
    component: keydb
spec:
  namespaceSelector:
    matchNames:
      - prod
      - qa
      - dev
  selector:
    matchLabels:
      app: keydb
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
