apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: image-pull-alerts
  namespace: monitoring
  labels:
    component: image-pull
spec:
  groups:
  - name: image-pull
    interval: 30s
    rules:
    - alert: ImagePullBackOff
      expr: count(kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"}) by (namespace, pod) > 0
      for: 5m
      labels:
        severity: warning
        component: image-pull
      annotations:
        summary: "Pod stuck in ImagePullBackOff"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} cannot pull image"

    - alert: HighImagePullLatency
      expr: histogram_quantile(0.99, rate(kubelet_image_pull_duration_seconds_bucket[5m])) > 30
      for: 10m
      labels:
        severity: warning
        component: image-pull
      annotations:
        summary: "High container image pull latency"
        description: "99th percentile image pull latency is {{ $value | humanize }}s"

    - alert: ImagePullFailureRateHigh
      expr: sum(rate(kubelet_image_pull_duration_seconds_count{code="failure"}[5m])) / sum(rate(kubelet_image_pull_duration_seconds_count[5m])) > 0.1
      for: 10m
      labels:
        severity: warning
        component: image-pull
      annotations:
        summary: "High image pull failure rate"
        description: "{{ $value | humanizePercentage }} of image pulls are failing"
