apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dns-alerts
  namespace: monitoring
  labels:
    component: dns
spec:
  groups:
  - name: dns
    interval: 30s
    rules:
    - alert: CoreDNSDown
      expr: up{job="coredns"} == 0
      for: 5m
      labels:
        severity: critical
        component: dns
      annotations:
        summary: "CoreDNS is unreachable"
        description: "CoreDNS metrics are unavailable"

    - alert: CoreDNSHighQueryLatency
      expr: histogram_quantile(0.99, rate(coredns_dns_request_duration_seconds_bucket[5m])) > 0.5
      for: 10m
      labels:
        severity: warning
        component: dns
      annotations:
        summary: "High CoreDNS query latency"
        description: "99th percentile DNS query latency is {{ $value | humanize }}s"

    - alert: CoreDNSHighErrorRate
      expr: sum(rate(coredns_dns_requests_total{rcode=~"SERVFAIL|REFUSED|NXDOMAIN"}[5m])) / sum(rate(coredns_dns_requests_total[5m])) > 0.05
      for: 10m
      labels:
        severity: warning
        component: dns
      annotations:
        summary: "High CoreDNS error rate"
        description: "{{ $value | humanizePercentage }} of DNS queries are returning errors"

    - alert: CoreDNSCacheMissRateHigh
      expr: rate(coredns_cache_misses_total[5m]) / (rate(coredns_cache_hits_total[5m]) + rate(coredns_cache_misses_total[5m]) + 0.0001) > 0.7
      for: 15m
      labels:
        severity: info
        component: dns
      annotations:
        summary: "High CoreDNS cache miss rate"
        description: "Cache miss rate is {{ $value | humanizePercentage }}, consider tuning cache size"
