global:
  cluster: pdx1
  namespace: dev
  domain: { prefix: pdx1-dev, base: telnoc.com }

noctel-worker-file:
  version: "latest"
  replicaCount: 1
  image:
    repository: pdx-harbor.telnoc.com/noctel/noctel-api-file-worker
    pullPolicy: Always
  env:
    HEALTH_PORT: "9275"
    HOST: "0.0.0.0"
    SERVICE_NAME: file-worker
    LOG_LEVEL: debug
    NODE_ENV: development
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
